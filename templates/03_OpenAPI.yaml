openapi: 3.1.0
info:
  title: "{{PROJECT_NAME}} — Core Service API Specification"
  version: 1.0.0
  summary: REST API & Webhooks contract generated and verified by SA-Spec-Pipeline.
  description: |
    Universal OpenAPI 3.1.0 specification template for **SA-Spec-Pipeline**.
    All resource endpoints, request/response schemas, field types, and status enums
    MUST strictly match the domain entities and state machine in `02_Architecture.md`.
servers:
  - url: https://api.example.com/v1
    description: Production API Server
  - url: https://sandbox.api.example.com/v1
    description: Sandbox / Staging API Server

security:
  - BearerAuth: []

tags:
  - name: CoreResources
    description: Lifecycle management of primary domain aggregates
  - name: Operations
    description: State transition actions, cancellations, or compensations
  - name: Webhooks
    description: Outbound asynchronous event notifications

paths:
  # Replace /resources with the actual domain resource paths (e.g., /orders, /bookings, /subscriptions, /claims)
  /resources:
    post:
      tags: [CoreResources]
      operationId: createResource
      summary: Create a new domain resource
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: Resource created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /resources/{resource_id}:
    get:
      tags: [CoreResources]
      operationId: getResourceById
      summary: Retrieve domain resource details by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Resource details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /resources/{resource_id}/cancel:
    post:
      tags: [Operations]
      operationId: cancelResource
      summary: Cancel or compensate an existing domain resource
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelResourceRequest"
      responses:
        "200":
          description: Resource state updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

webhooks:
  domainResourceEvent:
    post:
      tags: [Webhooks]
      operationId: onDomainResourceEvent
      summary: Outbound webhook event for domain aggregate lifecycle changes
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          description: HMAC-SHA256 signature of raw request body
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventPayload"
      responses:
        "200":
          description: Webhook acknowledged by consumer

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique UUID v4 key to guarantee idempotent execution (TTL 24h)
      schema:
        type: string
        format: uuid
    ResourceId:
      name: resource_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ResourceStatus:
      type: string
      description: Must match the State Machine and ERD statuses in 02_Architecture.md
      enum: [CREATED, PENDING, ACTIVE, COMPLETED, CANCELED, FAILED]

    CreateResourceRequest:
      type: object
      required: [actor_id, item_id]
      properties:
        actor_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        scheduled_at:
          type: [string, "null"]
          format: date-time

    CancelResourceRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
        immediate:
          type: boolean
          default: true

    ResourceResponse:
      type: object
      required:
        - id
        - actor_id
        - item_id
        - status
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ResourceStatus"
        scheduled_at:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Optimistic locking version
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookEventPayload:
      type: object
      required: [id, event_type, aggregate_id, created_at, data]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        aggregate_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true

    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        error_code:
          type: string
        trace_id:
          type: string

  responses:
    BadRequest:
      description: Invalid request syntax or validation error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Idempotency conflict, concurrent modification, or duplicate resource state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnprocessableEntity:
      description: Business rule (BR-*) violation or invalid state transition
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
