openapi: 3.1.0
info:
  title: "payment_gateway - Recurring Billing & Subscription API"
  version: 1.0.0
  summary: Enterprise API for recurring subscriptions, payment methods, invoices, and refunds.
  description: |
    OpenAPI 3.1 specification generated and verified by **SA-Spec-Pipeline**.
    All field names, data types, and enum values are strictly aligned with `02_Architecture.md` ERD.
servers:
  - url: https://api.billing.example.com/v1
    description: Production API Server
  - url: https://sandbox.api.billing.example.com/v1
    description: Sandbox API Server

security:
  - BearerAuth: []

tags:
  - name: Subscriptions
    description: Lifecycle management of customer recurring subscriptions
  - name: Invoices
    description: Billing invoices, payment attempts, and refunds
  - name: Webhooks
    description: Outbound event notifications sent to merchant endpoints

paths:
  /subscriptions:
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      summary: Create a new recurring subscription
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PaymentFailed"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /subscriptions/{subscription_id}:
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Retrieve subscription details by ID
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /subscriptions/{subscription_id}/cancel:
    post:
      tags: [Subscriptions]
      operationId: cancelSubscription
      summary: Cancel an active or past-due subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSubscriptionRequest"
      responses:
        "200":
          description: Subscription cancellation scheduled or completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  /invoices/{invoice_id}/refund:
    post:
      tags: [Invoices]
      operationId: refundInvoice
      summary: Issue a full or partial refund for a paid invoice
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundInvoiceRequest"
      responses:
        "200":
          description: Refund processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

webhooks:
  subscriptionStatusUpdated:
    post:
      tags: [Webhooks]
      operationId: onSubscriptionStatusUpdated
      summary: Outbound webhook event for subscription/invoice lifecycle changes
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          description: HMAC-SHA256 signature of raw request body
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEventPayload"
      responses:
        "200":
          description: Webhook acknowledged by merchant

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique UUID v4 key to guarantee idempotent execution (TTL 24h)
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SubscriptionStatus:
      type: string
      enum: [TRIALING, ACTIVE, PAST_DUE, SUSPENDED, CANCELED]

    InvoiceStatus:
      type: string
      enum: [DRAFT, OPEN, PAID, PAST_DUE, VOID, REFUNDED]

    CreateSubscriptionRequest:
      type: object
      required: [customer_id, plan_id, payment_method_id]
      properties:
        customer_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        payment_method_id:
          type: string
          format: uuid
        trial_days_override:
          type: [integer, "null"]
          minimum: 0
          maximum: 365

    CancelSubscriptionRequest:
      type: object
      required: [cancel_at_period_end]
      properties:
        cancel_at_period_end:
          type: boolean
          description: If true, subscription remains active until current_period_end; if false, cancels immediately.
        cancellation_reason:
          type: [string, "null"]
          maxLength: 500

    SubscriptionResponse:
      type: object
      required:
        - id
        - customer_id
        - plan_id
        - payment_method_id
        - status
        - current_period_start
        - current_period_end
        - cancel_at_period_end
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        payment_method_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
        next_billing_at:
          type: [string, "null"]
          format: date-time
        grace_period_ends_at:
          type: [string, "null"]
          format: date-time
        cancel_at_period_end:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RefundInvoiceRequest:
      type: object
      required: [amount_minor, reason]
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          description: Refund amount in minor currency units (e.g. cents/kopecks)
        reason:
          type: string
          maxLength: 255

    InvoiceResponse:
      type: object
      required:
        - id
        - subscription_id
        - amount_minor
        - currency
        - status
        - attempt_count
        - due_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        attempt_count:
          type: integer
          minimum: 0
        due_at:
          type: string
          format: date-time
        paid_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    WebhookEventPayload:
      type: object
      required: [id, event_type, aggregate_id, created_at, data]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - subscription.created
            - subscription.past_due
            - subscription.suspended
            - subscription.canceled
            - invoice.paid
            - invoice.payment_failed
            - invoice.refunded
        aggregate_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true

    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        error_code:
          type: string
        trace_id:
          type: string

  responses:
    BadRequest:
      description: Invalid request syntax or parameters
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PaymentFailed:
      description: Initial payment attempt declined by PSP
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    IdempotencyConflict:
      description: Idempotency-Key reused with different request payload or currently in-flight
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnprocessableEntity:
      description: Business rule violation or invalid state transition
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
